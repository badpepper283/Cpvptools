plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
}
version = '1.0.0'
group = 'dev.ben.cpvp'
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    // Yarn mapping'leri kullanarak Fabric API ile tam uyumluluk sağlıyoruz
    mappings "net.fabricmc:yarn:1.21.11+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
